global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Descubre todas las IP A asociadas al servicio Compose, incluidas las réplicas.
  - job_name: logifast-envios
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names:
          - envios-svc
        type: A
        port: 8080
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service_discovery_name

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: [pushgateway:9091]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
