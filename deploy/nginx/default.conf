# IE5 — Balanceador de carga (simula el ALB de AWS del diagrama de infraestructura).
# Reparte las peticiones entre todas las réplicas de "envios-svc" y vuelve a
# resolver el DNS interno de Docker cada 5 s, así detecta réplicas nuevas
# (docker compose up --scale) o reiniciadas sin reiniciar nginx.

# DNS interno de Docker
resolver 127.0.0.11 valid=5s ipv6=off;

upstream envios_backend {
    zone envios_backend 64k;
    # "resolve" (nginx >= 1.27.3) mantiene actualizada la lista de IPs de las réplicas.
    # Si una réplica falla 1 vez, se saca de rotación 10 s (failover pasivo).
    server envios-svc:8080 resolve max_fails=1 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Healthcheck propio del balanceador (no depende del backend)
    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://envios_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tiempos acotados: una réplica lenta no bloquea al cliente
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;

        # Si una réplica cae, la petición se reintenta en otra (solo métodos idempotentes)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # Evidencia de balanceo: qué réplica respondió
        add_header X-Served-By $upstream_addr always;
    }
}
