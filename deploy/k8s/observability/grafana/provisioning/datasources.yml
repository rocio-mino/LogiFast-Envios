# Copia de deploy/observability/grafana/provisioning (Rocío): los nombres de servicio
# prometheus/loki coinciden dentro del namespace "observability".
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
