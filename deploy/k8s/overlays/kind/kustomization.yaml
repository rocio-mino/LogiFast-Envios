apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Clúster efímero "kind" dentro de GitHub Actions: valida en cada Pull Request
# que los manifiestos se aplican, que los pods arrancan bajo Pod Security
# "restricted" y que la observabilidad recibe métricas y logs, antes de
# autorizar cualquier despliegue en la nube.
resources:
  - ../../base
  - ../../observability
