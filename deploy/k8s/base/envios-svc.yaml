# =============================================================================
# Microservicio envios-svc en Kubernetes (IE2).
#
#  - 2 réplicas mínimas repartidas entre nodos, escalado automático (HPA) y
#    PodDisruptionBudget: disponibilidad durante despliegues y mantenimiento.
#  - startup / liveness / readiness con Spring Boot Actuator: Kubernetes reinicia
#    réplicas colgadas y solo envía tráfico a las que tienen base de datos.
#  - Puerto de negocio (8080) separado del puerto de administración (8081):
#    el Service público solo expone 8080; métricas y health quedan internos.
#  - Trazabilidad: la imagen se etiqueta con el SHA del commit y el ConfigMap
#    "envios-build-info" (generado por el pipeline) inyecta commit y versión,
#    visibles en /actuator/info y como anotaciones del Deployment.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envios-svc
  labels:
    app.kubernetes.io/name: envios-svc
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: logifast-envios
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # nunca baja de las réplicas sanas durante un despliegue
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: envios-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envios-svc
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: logifast-envios
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: envios-svc
      containers:
        - name: envios-svc
          # Nombre lógico: el pipeline lo reemplaza por la imagen real etiquetada con el SHA.
          image: logifast-envios:set-by-pipeline
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/envios
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: envios-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: envios-db
                  key: password
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: org.postgresql.Driver
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            - name: SPRING_H2_CONSOLE_ENABLED
              value: "false"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "10"
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 20s
            # Actuator en un puerto interno distinto al del API público
            - name: MANAGEMENT_SERVER_PORT
              value: "8081"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
            - name: HOME
              value: /tmp
            # Trazabilidad commit -> imagen -> despliegue
            - name: APP_COMMIT
              valueFrom:
                configMapKeyRef:
                  name: envios-build-info
                  key: commit
            - name: APP_PIPELINE_RUN
              valueFrom:
                configMapKeyRef:
                  name: envios-build-info
                  key: pipeline-run
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36   # hasta 3 minutos para el arranque de la JVM
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 750m        # mismo límite que en Docker Compose (dashboard normaliza por 0.75)
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
# Service interno: API (http) y Actuator (management) para Prometheus.
apiVersion: v1
kind: Service
metadata:
  name: envios-svc
  labels:
    app.kubernetes.io/name: envios-svc
    app.kubernetes.io/part-of: logifast-envios
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: envios-svc
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 8081
      targetPort: management
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: envios-svc
  labels:
    app.kubernetes.io/name: envios-svc
    app.kubernetes.io/part-of: logifast-envios
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: envios-svc
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envios-svc
  labels:
    app.kubernetes.io/name: envios-svc
    app.kubernetes.io/part-of: logifast-envios
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: envios-svc
