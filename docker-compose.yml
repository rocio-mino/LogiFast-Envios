# =============================================================================
# LogiFast · Envíos — Docker Compose base y observabilidad local EP3 (IE1 · IE3 · IE4 · IE6)
#
#   cliente ──► lb (nginx, :8080) ──► envios-svc × N réplicas ──► db (PostgreSQL)
#               red "frontend"            redes frontend + backend    red "backend" (interna)
#
# Simula la arquitectura cloud del proyecto: ALB → tareas Fargate → base de datos
# administrada. Todos los parámetros se pueden sobrescribir con variables de
# entorno (ver .env.example).
# =============================================================================

name: logifast-envios

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"   # evita que los logs llenen el disco del host
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Base de datos compartida por todas las réplicas (simula Aurora PostgreSQL)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-envios}
      POSTGRES_USER: ${DB_USER:-envios}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-envios_local_dev}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Microservicio de Envíos (imagen construida por el Dockerfile)
  # ---------------------------------------------------------------------------
  envios-svc:
    build: .
    # Etiqueta = SHA corto del commit en el pipeline; "1.0.0" en local
    image: ${IMAGE_NAME:-duoc/jv0101-caso17-envios}:${IMAGE_TAG:-1.0.0}
    # Sin container_name ni ports: así se puede escalar a N réplicas detrás del balanceador
    environment:
      # Conexión a la base compartida (sobrescribe el H2 en memoria de application.yml)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-envios}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-envios}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-envios_local_dev}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # "update" conserva los datos entre reinicios y no borra tablas cuando se apaga una réplica
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      # Seguridad: la consola H2 no se expone en el entorno desplegado
      SPRING_H2_CONSOLE_ENABLED: "false"
      # Escalabilidad: 2 réplicas × 10 conexiones = 20, muy por debajo del máximo de PostgreSQL (100)
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_SIZE:-10}
      SERVER_TOMCAT_THREADS_MAX: ${TOMCAT_MAX_THREADS:-100}
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 20s
      # JVM consciente del límite de memoria del contenedor
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
      # Trazabilidad: commit visible en /actuator/info
      APP_COMMIT: ${GIT_COMMIT:-local}
      HOME: /tmp
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # readiness = aplicación arriba + base de datos accesible
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
      start_interval: 5s
    deploy:
      replicas: ${APP_REPLICAS:-2}
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
          pids: 512
        reservations:
          cpus: "0.25"
          memory: 256M
    # Endurecimiento del contenedor: el usuario sin privilegios "app" viene del
    # Dockerfile; aquí se agrega sistema de archivos de solo lectura y sin capacidades de Linux
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Balanceador de carga (simula el ALB). Único punto de entrada publicado.
  # ---------------------------------------------------------------------------
  lb:
    image: nginx:1.28-alpine
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      envios-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/lb-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging


  # ---------------------------------------------------------------------------
  # EP3 — Prometheus: métricas de Spring Boot, contenedores y ejecuciones CI.
  # Escucha en localhost únicamente; no queda expuesto a la red externa.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - frontend
      - observability
    depends_on:
      - pushgateway
      - cadvisor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # EP3 — Pushgateway: conserva métricas puntuales calculadas por CI/CD:
  # cobertura JaCoCo y duración del despliegue.
  # ---------------------------------------------------------------------------
  pushgateway:
    image: prom/pushgateway:v1.11.4
    command:
      - --persistence.file=/pushgateway/metrics.db
      - --persistence.interval=1m
    ports:
      - "127.0.0.1:${PUSHGATEWAY_PORT:-9091}:9091"
    volumes:
      - pushgateway-data:/pushgateway
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # EP3 — cAdvisor: métricas de CPU y memoria por contenedor Docker.
  # Servicio de desarrollo local; requiere Docker Engine con soporte cgroups.
  # ---------------------------------------------------------------------------
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 160M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # EP3 — Loki + Alloy: almacenamiento y recolección centralizada de logs.
  # Alloy necesita acceso al socket Docker para descubrir y leer los contenedores.
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.10
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./deploy/observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.22.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - observability
    depends_on:
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # EP3 — Grafana: dashboard provisionado automáticamente (solo localhost).
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-logifast-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging: *default-logging

networks:
  frontend:
  backend:
    internal: true   # la base de datos no tiene salida ni es accesible desde fuera
  observability:

volumes:
  db-data:
  prometheus-data:
  pushgateway-data:
  loki-data:
  alloy-data:
  grafana-data:
