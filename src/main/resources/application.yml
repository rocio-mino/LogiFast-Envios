spring:
  application:
    name: envios-svc
  datasource:
    url: jdbc:h2:mem:enviosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}
  # IE3: cierre ordenado (las réplicas terminan las peticiones en curso antes de detenerse)
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ---------------------------------------------------------------------------
# IE3 / IE4 / IE5 — Observabilidad para healthchecks, despliegue y trazabilidad
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # Solo se exponen health e info (principio de mínimo privilegio)
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness y /actuator/health/readiness
      show-details: never      # no se filtran detalles internos
      group:
        readiness:
          include: readinessState,db   # "listo" solo si la base de datos responde
  info:
    env:
      enabled: true
    java:
      enabled: true

# Datos expuestos en /actuator/info: permiten verificar qué versión y qué commit
# están corriendo después de cada despliegue (trazabilidad IE4).
info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'
    commit: ${APP_COMMIT:local}
    instance: ${HOSTNAME:local}
