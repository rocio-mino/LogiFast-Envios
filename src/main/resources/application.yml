spring:
  application:
    name: envios-svc
  datasource:
    url: jdbc:h2:mem:enviosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}
  # Cierre ordenado: las réplicas terminan las peticiones en curso antes de detenerse.
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# EP3 — Actuator, métricas y trazabilidad.
management:
  endpoints:
    web:
      exposure:
        # Prometheus se consulta desde la red interna de observabilidad.
        # El balanceador no publica /actuator/prometheus hacia el host.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true
    java:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  prometheus:
    metrics:
      export:
        enabled: true

# Datos expuestos en /actuator/info para trazabilidad del despliegue.
info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'
    commit: ${APP_COMMIT:local}
    instance: ${HOSTNAME:local}
